<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 572" width="720" height="572" role="img" aria-label="Home Layout Card showing a ground floor plan with live markers (dark theme)">
  <title>Home Layout Card showing a ground floor plan with live markers (dark theme)</title>
  <desc>A Home Layout Card showing the ground floor of a house: floor tabs across the top, a floorplan below, and live entity markers placed on the rooms. The living room and kitchen lights are on, so those rooms are tinted.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { fill: #1c1c1c; stroke: #2f2f2f; stroke-width: 1; }
    .title { font-size: 22px; font-weight: 400; fill: #e1e1e1; }
    .toolbg { fill: transparent; }
    .ic-tool { fill: #9b9b9b; }
    .tab { font-size: 14px; font-weight: 500; fill: #9b9b9b; text-anchor: middle; }
    .tab.active { fill: #03a9f4; }
    .tabline { fill: #03a9f4; }
    .divider { stroke: rgba(255,255,255,.14); stroke-width: 1; }

    .room { fill: #2b3136; stroke: #78909c; stroke-width: 4; stroke-linejoin: round; }
    .lit { fill: #fdd835; opacity: .45; }
    .door { stroke: #2b3136; stroke-width: 6; stroke-linecap: round; }
    .outer { fill: none; stroke: #90a4ae; stroke-width: 8; stroke-linejoin: round; }
    .rlabel { font-size: 15px; font-weight: 500; fill: #b0bec5;
               text-anchor: middle; dominant-baseline: middle; }

    .puck.off { fill: #1c1c1c; stroke: rgba(255,255,255,.14); stroke-width: 1; }
    .puck.on { fill: #fdd835; stroke: none; }
    .glow { fill: #fdd835; opacity: .28; }
    .dot-ring { fill: #1c1c1c; }
    .ic-off { fill: #9b9b9b; }
    .ic-on { fill: #1c1c1c; }
    .badge-tx { font-size: 12px; font-weight: 500; }
    .badge-tx.off { fill: #e1e1e1; }
    .badge-tx.on { fill: #1c1c1c; }
    .cap-bg { fill: #2c2c2c; stroke: rgba(255,255,255,.14); stroke-width: 1; }
    .cap-tx { font-size: 11px; font-weight: 500; fill: #e1e1e1; text-anchor: middle; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="719" height="571" rx="12"/><text class="title" x="20" y="42">Our House</text><circle class="toolbg" cx="656" cy="34" r="17"/><g transform="translate(645.00,23.00) scale(0.9167)"><path class="ic-tool" d="M12,16L19.36,10.27L21,9L12,2L3,9L4.63,10.27M12,18.54L4.62,12.81L3,14.07L12,21.07L21,14.07L19.37,12.8L12,18.54Z"/></g><circle class="toolbg" cx="692" cy="34" r="17"/><g transform="translate(681.00,23.00) scale(0.9167)"><path class="ic-tool" d="M5,5H10V7H7V10H5V5M14,5H19V10H17V7H14V5M17,14H19V19H14V17H17V14M10,17V19H5V14H7V17H10Z"/></g><text class="tab " x="44.0" y="79">Loft</text><text class="tab " x="119.0" y="79">First Floor</text><text class="tab active" x="223.0" y="79">Ground Floor</text><rect class="tabline" x="166" y="90" width="114" height="2" rx="1"/><line class="divider" x1="16" y1="91" x2="704" y2="91"/>

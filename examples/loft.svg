<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Loft">
  <title>Loft</title>
  <style>
    .room  { fill: #eceff1; stroke: #455a64; stroke-width: 4; stroke-linejoin: round; }
    .label { font: 500 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
             fill: #546e7a; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .door  { stroke: #eceff1; stroke-width: 6; stroke-linecap: round; }
    .outer { fill: none; stroke: #263238; stroke-width: 8; stroke-linejoin: round; }
  </style>
  <rect class="outer" x="16" y="16" width="768" height="488" rx="6"/>
  <rect id="studio" class="room" x="20" y="20" width="360" height="480"/>
  <rect id="stairs" class="room" x="380" y="20" width="120" height="480"/>
  <rect id="storage" class="room" x="500" y="20" width="280" height="240"/>
  <rect id="shower" class="room" x="500" y="260" width="280" height="240"/>
  <line class="door" x1="380" y1="220" x2="380" y2="300"/>
  <line class="door" x1="500" y1="100" x2="500" y2="170"/>
  <line class="door" x1="500" y1="340" x2="500" y2="410"/>
  <text class="label" x="200" y="260">Attic Studio</text>
  <text class="label" x="440" y="260">Stairs</text>
  <text class="label" x="640" y="140">Storage</text>
  <text class="label" x="640" y="380">Shower Room</text>
</svg>

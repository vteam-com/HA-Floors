<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="First floor">
  <title>First floor</title>
  <style>
    .room  { fill: #eceff1; stroke: #455a64; stroke-width: 4; stroke-linejoin: round; }
    .label { font: 500 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
             fill: #546e7a; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .door  { stroke: #eceff1; stroke-width: 6; stroke-linecap: round; }
    .outer { fill: none; stroke: #263238; stroke-width: 8; stroke-linejoin: round; }
  </style>
  <rect class="outer" x="16" y="16" width="768" height="488" rx="6"/>
  <rect id="master" class="room" x="20" y="20" width="360" height="280"/>
  <rect id="bed4" class="room" x="20" y="300" width="360" height="200"/>
  <rect id="landing" class="room" x="380" y="20" width="120" height="480"/>
  <rect id="bed2" class="room" x="500" y="20" width="280" height="240"/>
  <rect id="bath" class="room" x="500" y="260" width="280" height="120"/>
  <rect id="bed3" class="room" x="500" y="380" width="280" height="120"/>
  <line class="door" x1="380" y1="120" x2="380" y2="180"/>
  <line class="door" x1="380" y1="360" x2="380" y2="420"/>
  <line class="door" x1="500" y1="100" x2="500" y2="160"/>
  <line class="door" x1="500" y1="290" x2="500" y2="340"/>
  <line class="door" x1="500" y1="420" x2="500" y2="470"/>
  <line class="door" x1="200" y1="300" x2="260" y2="300"/>
  <text class="label" x="200" y="160">Main Bedroom</text>
  <text class="label" x="200" y="400">Bedroom 4</text>
  <text class="label" x="440" y="260">Landing</text>
  <text class="label" x="640" y="140">Bedroom 2</text>
  <text class="label" x="640" y="320">Bathroom</text>
  <text class="label" x="640" y="440">Bedroom 3</text>
</svg>

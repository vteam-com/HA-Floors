# Rooms are described the way people describe a house: each one has a real size
# and says which room it joins, on which wall, and where the door goes. The card
# works out the coordinates — nothing here is an x/y position.
#
# Devices come from your own Home Assistant entities. Link a room to an HA area
# and the editor offers that area's entities; a device with no position is laid
# out inside its room automatically.
type: custom:home-layout-card
title: Home
units: auto                  # auto follows Home Assistant | metric | imperial
floors:
  - id: ground
    name: Ground
    level: 0
    rooms:
      # No `attach`, so this room anchors the storey.
      - id: living
        name: Living Room
        area: living_room    # optional Home Assistant area id
        size: [10, 12]
        devices:
          - light.living_room_lamp
          - entity: media_player.tv
            x: 50            # optional: % across the room
            y: 8             # % down the room

      - id: kitchen
        name: Kitchen
        area: kitchen
        size: [9, 9]
        color: "#26a69a"   # any CSS colour, or var(--accent-color)
        fill: 30           # how strongly it fills, per cent (default 8)
        attach:
          to: living
          wall: east         # north | east | south | west
          door:
            at: 5            # metres along the shared wall
            width: 1.1
        devices:
          - light.kitchen_ceiling
          - sensor.kitchen_temperature
          - binary_sensor.fridge_door

      - id: hall
        name: Hall
        size: [2.5, 12]
        attach:
          to: living
          wall: west
          door: true         # true = centred on the shared wall
        devices:
          - light.hall

      - id: utility
        name: Utility
        size: [9, 3]
        attach:
          to: kitchen
          wall: south
          door: { at: 1, width: 0.8 }

  - id: first
    name: First
    level: 1
    rooms:
      - id: landing
        name: Landing
        size: [2.5, 12]

      - id: main_bed
        name: Main Bedroom
        area: bedroom
        size: [5, 6]
        attach:
          to: landing
          wall: east
          door: { at: 2 }
        devices:
          - light.bedroom

      - id: bed2
        name: Bedroom 2
        size: [5, 6]
        attach:
          to: main_bed
          wall: south
          door: true

      - id: bathroom
        name: Bathroom
        size: [3, 4]
        attach:
          to: landing
          wall: west
          door: { at: 1 }
